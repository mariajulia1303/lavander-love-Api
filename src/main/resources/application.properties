# banco em memoria, some tudo quando desliga a app
spring.datasource.url=jdbc:h2:mem:floricultura
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# console do H2 pra dar uma olhada nos dados em http://localhost:8080/h2-console
spring.h2.console.enabled=true

# deixa o hibernate criar/atualizar as tabelas sozinho
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# precisa disso pro data.sql rodar depois que o hibernate monta as tabelas
spring.jpa.defer-datasource-initialization=true

# swagger ui: usamos uma index.html propria em static/swagger-ui que carrega
# o tema roxo e o logo. a UI fica em /swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html

# ================= PARTE 2: recursos avancados =================

# --- CORS: origens que podem chamar a API pelo navegador (separadas por virgula) ---
# 5500 = Live Server do VS Code; 63342 = servidor embutido do IntelliJ ("Open in Browser")
lavander.cors.allowed-origins=${LAVANDER_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://localhost:63342,http://127.0.0.1:63342}

# --- Chaves de API iniciais (so pra desenvolvimento/demonstracao!) ---
# criar chave exige chave ADMIN, entao a primeira precisa vir daqui.
# em producao defina as variaveis de ambiente e nao publique os valores.
lavander.security.chave-admin=${LAVANDER_ADMIN_KEY:ll_admin_dev_123}
lavander.security.chave-escrita=${LAVANDER_ESCRITA_KEY:ll_escrita_dev_123}
lavander.security.chave-leitura=${LAVANDER_LEITURA_KEY:ll_leitura_dev_123}

# --- Rate limit: algoritmo TOKEN BUCKET (balde de fichas) ---
# cada requisicao gasta 1 ficha; o balde recarrega aos poucos.
# limites das chaves vem do PLANO delas (Plano.java: GRATUITO 8/20 por min, BASICO 20/60, PROFISSIONAL 50/240).
# limites baixos de proposito: clicar ~10x seguidas no Swagger ja tem que dar 429.
# sem chave (contado por IP)
lavander.rate-limit.anonimo.capacidade=5
lavander.rate-limit.anonimo.recarga-por-minuto=15
# limite global da API inteira (protege contra DDoS / muitos clientes ao mesmo tempo)
lavander.rate-limit.global.capacidade=200
lavander.rate-limit.global.recarga-por-minuto=600
# penalidade: N requisicoes negadas seguidas (insistir depois do 429) -> bloqueio temporario
lavander.rate-limit.penalidade.tentativas=5
lavander.rate-limit.penalidade.segundos=30
# plano das chaves de demonstracao
lavander.security.plano-chaves-demo=GRATUITO

# --- Conta e login (/auth): chave pessoal que cada pessoa gera depois de entrar ---
lavander.auth.sessao-minutos=60
lavander.auth.nivel-chave-pessoal=ESCRITA
lavander.auth.plano-chave-pessoal=BASICO

# --- Idempotencia: por quanto tempo uma X-Idempotency-Key fica guardada ---
lavander.idempotency.ttl-horas=24

# swagger ui padrao lista os grupos v1 e v2
springdoc.swagger-ui.urls-primary-name=v1
springdoc.swagger-ui.persist-authorization=true

# atras de proxy (ex: Render) respeita X-Forwarded-Proto/Host: links HATEOAS saem com https
# e o CORS entende corretamente o que e "mesma origem"
server.forward-headers-strategy=framework
