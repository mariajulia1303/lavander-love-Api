# banco em memoria, some tudo quando desliga a app
spring.datasource.url=jdbc:h2:mem:floricultura
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# console do H2 pra dar uma olhada nos dados em http://localhost:8080/h2-console
spring.h2.console.enabled=true

# deixa o hibernate criar/atualizar as tabelas sozinho
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# precisa disso pro data.sql rodar depois que o hibernate monta as tabelas
spring.jpa.defer-datasource-initialization=true

# swagger ui: usamos uma index.html propria em static/swagger-ui que carrega
# o tema roxo e o logo. a UI fica em /swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html
